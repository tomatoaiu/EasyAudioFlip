name: Release

on:
  pull_request:
    branches:
      - main
    paths:
      - ".release-please-manifest.json"
    types:
      - closed
  workflow_dispatch:
    inputs:
      release_sha:
        description: Merged release commit SHA
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    if: >-
      ${{
        github.repository == 'tomatoaiu/EasyAudioFlip' &&
        github.actor == github.repository_owner &&
        (
          github.event_name == 'workflow_dispatch' ||
          (
            github.event_name == 'pull_request' &&
            github.event.pull_request.merged == true &&
            github.event.pull_request.base.ref == 'main' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.user.login == 'github-actions[bot]' &&
            startsWith(
              github.event.pull_request.head.ref,
              'release-please--branches--main'
            ) &&
            contains(
              github.event.pull_request.labels.*.name,
              'autorelease: pending'
            )
          )
        )
      }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      RELEASE_SHA: ${{ inputs.release_sha || github.event.pull_request.merge_commit_sha }}
    outputs:
      release_pr_number: ${{ steps.metadata.outputs.release_pr_number }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_SHA }}

      - name: Validate release metadata
        id: metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_RELEASE_SHA: ${{ inputs.release_sha }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          version=$(node --input-type=module -e '
            import { readFileSync } from "node:fs"
            const pattern = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/
            const pkg = JSON.parse(readFileSync("package.json", "utf8")).version
            const tauri = JSON.parse(readFileSync("src-tauri/tauri.conf.json", "utf8")).version
            const cargo = readFileSync("src-tauri/Cargo.toml", "utf8").match(/^version = "([^"]+)"/m)?.[1]
            const lock = readFileSync("src-tauri/Cargo.lock", "utf8").match(/\[\[package\]\]\r?\nname = "easy-audio-flip"\r?\nversion = "([^"]+)"/)?.[1]
            const manifest = JSON.parse(readFileSync(".release-please-manifest.json", "utf8"))["."]
            for (const [name, value] of [["package.json", pkg], ["tauri.conf.json", tauri], ["Cargo.toml", cargo], ["Cargo.lock", lock], ["manifest", manifest]]) {
              if (value !== pkg || !pattern.test(value ?? "")) {
                throw new Error(name + " version does not match package.json: " + value)
              }
            }
            process.stdout.write(pkg)
          ')

          release_sha=$(git rev-parse HEAD)
          if [[ "$release_sha" != "$RELEASE_SHA" ]]; then
            echo "Checked out ${release_sha}, expected ${RELEASE_SHA}." >&2
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$release_sha" origin/main; then
            echo "Release commit is not on main." >&2
            exit 1
          fi

          release_pr_number="${PULL_REQUEST_NUMBER:-}"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_pr_number=$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                "repos/${GITHUB_REPOSITORY}/commits/${release_sha}/pulls" |
                jq -er \
                  --arg repository "$GITHUB_REPOSITORY" \
                  --arg sha "$release_sha" '
                    [
                      .[]
                      | select(
                          .merged_at != null
                          and .merge_commit_sha == $sha
                          and .base.ref == "main"
                          and .head.repo.full_name == $repository
                          and .user.login == "github-actions[bot]"
                          and (
                            .head.ref
                            | startswith("release-please--branches--main")
                          )
                          and (
                            [.labels[].name]
                            | index("autorelease: pending") != null
                          )
                        )
                    ]
                    | if length == 1 then
                        .[0].number
                      else
                        error(
                          "Expected one pending Release Please PR, found \(length)"
                        )
                      end
                  '
            )
          fi

          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin \
            "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} exists without a published release." >&2
            exit 1
          fi

          {
            echo "release_pr_number=${release_pr_number}"
            echo "tag=${tag}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Rust cache
        uses: swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri
          shared-key: windows-release
          cache-on-failure: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          RUSTC_WRAPPER: sccache
        run: pnpm tauri build

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          msi=(src-tauri/target/release/bundle/msi/*.msi)
          exe=(src-tauri/target/release/bundle/nsis/*.exe)
          if [[ ${#msi[@]} -ne 1 || ${#exe[@]} -ne 1 ]]; then
            echo "Expected one MSI and one EXE installer." >&2
            exit 1
          fi
          for installer in "${msi[0]}" "${exe[0]}"; do
            if [[ "$(basename "$installer")" != *"_${VERSION}_"* ]]; then
              echo "Installer name does not contain ${VERSION}: ${installer}" >&2
              exit 1
            fi
          done

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists." >&2
            exit 1
          fi

          gh release create "$TAG" \
            "${msi[0]}#Windows installer (MSI)" \
            "${exe[0]}#Windows installer (EXE)" \
            --fail-on-no-commits \
            --generate-notes \
            --target "$RELEASE_SHA"

      - name: Mark release pull request as published
        if: steps.metadata.outputs.release_pr_number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.metadata.outputs.release_pr_number }}
        run: |
          gh pr edit "$PR_NUMBER" --remove-label "autorelease: pending"
