name: Prepare release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: prepare-release
  cancel-in-progress: true

permissions: {}

jobs:
  release-please:
    if: >-
      ${{
        github.repository == 'tomatoaiu/EasyAudioFlip' &&
        github.actor == github.repository_owner
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check release baseline
        id: baseline
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version=$(node --input-type=module -e '
            import { readFileSync } from "node:fs"
            const { version } = JSON.parse(readFileSync("package.json", "utf8"))
            if (!/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(version)) {
              throw new Error("Invalid package version: " + version)
            }
            process.stdout.write(version)
          ')

          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release v${version} does not exist; skipping release preparation."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create or update release pull request
        if: steps.baseline.outputs.ready == 'true'
        uses: googleapis/release-please-action@v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ github.token }}
