name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "src-tauri/**"
      - ".github/workflows/ci.yml"
  # main の push だけが、後続 PR から読める default-branch cache を書く。
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: pkg-config libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
          version: 1.0
          execute_install_scripts: true

      - name: Rust cache
        uses: swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Run clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings
