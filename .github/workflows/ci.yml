name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "src-tauri/**"
      - ".github/workflows/ci.yml"
  # main の push だけが、後続 PR から読める default-branch cache を書く。
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Restore APT archives
        id: apt-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/apt-archives
          key: apt-archives-v1-${{ runner.os }}-${{ runner.arch }}-gtk-webkit-4.1

      - name: Install system dependencies
        run: |
          set -euo pipefail
          mkdir -p "$HOME/apt-archives"
          sudo mkdir -p /var/cache/apt/archives/partial
          shopt -s nullglob
          debs=("$HOME/apt-archives"/*.deb)
          if (( ${#debs[@]} > 0 )); then
            sudo cp -n "${debs[@]}" /var/cache/apt/archives/
          fi
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
          cp -n /var/cache/apt/archives/*.deb "$HOME/apt-archives/"

      - name: Save APT archives
        if: success() && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust cache
        uses: swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Run clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings
